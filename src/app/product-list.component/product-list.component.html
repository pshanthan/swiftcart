<div *ngFor="let p of products">
  <div>{{ p.id }}</div>
  <div>{{ p.name }}</div>
  <div>{{ p.price }}</div>
  <div>
    <button (click)="addToCart(p)">Add To Cart</button>
  </div>
</div>
<div *ngFor="let p of wishList">
  <div>{{ p.id }}</div>
  <div>{{ p.name }}</div>
  <div>{{ p.price }}</div>
</div>
